# Module 20 — sample Fly.io config for the mini-Ruderal SERVER.
# Deploy with:  fly launch --no-deploy   (to create the app), then  fly deploy
# Create the persistent volume once:  fly volumes create mini_ruderal_data --size 1
app = "mini-ruderal"           # change to your unique app name
primary_region = "ams"          # pick a region near you

[build]
  # uses the Dockerfile in this directory

[http_service]
  internal_port = 2567          # must match the server's PORT
  force_https = true            # so browsers connect over wss://
  auto_stop_machines = false    # keep the game server always on
  auto_start_machines = true
  min_machines_running = 1

# Persistent disk for the edit journal + player store (DATA_DIR=/data).
[[mounts]]
  source = "mini_ruderal_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
